<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 54" width="1200" height="54" role="img" aria-label="S-CLASS // SILICON BUS">
  <defs>
    <linearGradient id="divLineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="divLineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left & Right Spline-Expanding Circuit Lines -->
  <rect x="60" y="26.2" width="504" height="1.6" fill="url(#divLineL)">
    <animate attributeName="x" from="564" to="60" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    <animate attributeName="width" from="0" to="504" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </rect>
  <rect x="636" y="26.2" width="504" height="1.6" fill="url(#divLineR)">
    <animate attributeName="width" from="0" to="504" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </rect>

  <!-- Outward Racing Voltage Pulses -->
  <circle cx="560" cy="27" r="2.8" fill="#34D399">
    <animate attributeName="cx" values="564;90" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="27" r="2.8" fill="#67E8F9">
    <animate attributeName="cx" values="636;1110" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Center Counter-Rotating Micro Reactor -->
  <g transform="translate(600,27)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
      <path d="M 0.00 -17.00 L 2.61 -19.83 L 5.18 -19.32 L 6.51 -15.71 L 8.50 -14.72 L 12.18 -15.87 L 14.14 -14.14 L 13.49 -10.35 L 14.72 -8.50 L 18.48 -7.65 L 19.32 -5.18 L 16.85 -2.22 L 17.00 0.00 L 19.83 2.61 L 19.32 5.18 L 15.71 6.51 L 14.72 8.50 L 15.87 12.18 L 14.14 14.14 L 10.35 13.49 L 8.50 14.72 L 7.65 18.48 L 5.18 19.32 L 2.22 16.85 L 0.00 17.00 L -2.61 19.83 L -5.18 19.32 L -6.51 15.71 L -8.50 14.72 L -12.18 15.87 L -14.14 14.14 L -13.49 10.35 L -14.72 8.50 L -18.48 7.65 L -19.32 5.18 L -16.85 2.22 L -17.00 0.00 L -19.83 -2.61 L -19.32 -5.18 L -15.71 -6.51 L -14.72 -8.50 L -15.87 -12.18 L -14.14 -14.14 L -10.35 -13.49 L -8.50 -14.72 L -7.65 -18.48 L -5.18 -19.32 L -2.22 -16.85 Z" fill="#070C18" stroke="#34D399" stroke-width="1.3"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite"/>
      <polygon points="0.0,-13.0 2.1,-5.1 9.2,-9.2 5.1,-2.1 13.0,0.0 5.1,2.1 9.2,9.2 2.1,5.1 0.0,13.0 -2.1,5.1 -9.2,9.2 -5.1,2.1 -13.0,0.0 -5.1,-2.1 -9.2,-9.2 -2.1,-5.1" fill="#0B1324" stroke="#67E8F9" stroke-width="1.2"/>
    </g>
    <circle cx="0" cy="0" r="3.2" fill="#67E8F9">
      <animate attributeName="r" values="2.4;4.2;2.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>