        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="55%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#080C17"/>
    </linearGradient>
    <radialGradient id="sigilGlow" cx="84%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#E8B44C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="12%" cy="22%" r="40%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
