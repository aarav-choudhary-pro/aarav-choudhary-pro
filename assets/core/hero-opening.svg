    <linearGradient id="emberLin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#E8B44C"/>
      <stop offset="100%" stop-color="#B45309"/>
