    <text x="995" y="194" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="8.8" fill="#CBD5E1">pH · TDS · DHT22</text>

