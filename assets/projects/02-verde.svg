  <text x="36" y="36" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1.4">02 // CBSE NATIONALS · DAV ACON 5 · TULSI TECH</text>
  <rect x="575" y="18" width="133" height="25" rx="12.5" fill="#081E17" stroke="#34D399" stroke-width="1.1" stroke-opacity="0.7"/>
