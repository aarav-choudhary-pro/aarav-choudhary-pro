  <path id="pcbFlow2" d="M 792 214 L 836 214 L 932 195 L 958 248 L 985 248" fill="none"/>
  <circle r="3.5" fill="#FBBF24" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.2s" repeatCount="indefinite"/><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#pcbFlow1"/></animateMotion></circle>
  <circle r="3.5" fill="#34D399" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.6s" begin="0.9s" repeatCount="indefinite"/><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#pcbFlow2"/></animateMotion></circle>
