  <text x="36" y="322" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.8" font-weight="600" fill="#94A3B8">▸ 4 LIVE DEPLOYMENTS BELOW: CBSE COMPENDIUM · VERDE OS v3 · 3D ARCHIVE · TULSI v2</text>

