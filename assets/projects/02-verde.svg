    <text x="1051" y="264" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#94A3B8">AUTONOMOUS DOSING · ZERO HUMAN LOOP</text>
