  <!-- Title & Subtitle -->
  <text x="36" y="76" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="0.4">PROJECT VERDE (VERDE OS v3.0)</text>
  <text x="36" y="101" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Autonomous closed-loop vertical hydroponic farm — where chlorophyll meets custom 2-layer silicon.</text>

  <!-- Aarav Role Highlight Box -->
  <rect x="36" y="116" width="672" height="62" rx="10" fill="#081E17" stroke="#34D399" stroke-width="1.1" stroke-opacity="0.48"/>
  <text x="52" y="138" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#34D399" letter-spacing="0.8">MY ROLE // 02 · HARDWARE, PCB LAYOUT, POWER DELIVERY &amp; PHYSICAL BUILD</text>
  <text x="52" y="162" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="11.6" font-weight="600" fill="#F8FAFC">Built the 2-layer KiCad PCB, LM2596 5V/3A power rail, flyback relays &amp; 20-site tower.</text>

  <!-- Key Specs Bullets -->
  <circle cx="43" cy="204" r="2.8" fill="#34D399"/><text x="54" y="208" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" fill="#CBD5E1">Saves 95% water across a 4-tier 20-site tower with industrial RS485 NPK, pH, TDS &amp; DHT22 telemetry.</text><circle cx="43" cy="226" r="2.8" fill="#34D399"/><text x="54" y="230" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" fill="#CBD5E1">38ms on-edge TFLite INT8 OV2640 leaf vision + live Next.js VERDE OS Mission Control &amp; AI Doctor.</text>

