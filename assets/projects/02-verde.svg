    <text x="836" y="68" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" fill="#34D399">20-SITE TOWER</text>

