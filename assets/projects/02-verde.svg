    <text x="995" y="124" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="8.8" fill="#CBD5E1">12V → 5V / 3A</text>

    <rect x="1058" y="86" width="100" height="52" rx="6" fill="#0B1320" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="1108" y="108" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" fill="#38BDF8">ESP32-CAM</text>
    <text x="1108" y="124" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="8.8" fill="#CBD5E1">OV2640 · 38ms</text>

    <rect x="944" y="156" width="102" height="52" rx="6" fill="#0B1320" stroke="#34D399" stroke-width="1.2"/>
