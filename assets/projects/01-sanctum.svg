  <text x="36" y="101" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#94A3B8">A secret rebellion network disguised behind two dead 1998–2013 blogs — discovery is the interview.</text>

