  <text x="52" y="162" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="11.6" font-weight="600" fill="#F8FAFC">"Wrote the world. Holds the 8-minute hook." — Delivered Slides 01–03 &amp; 10–12 in Finals.</text>

